<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Orion — Explorer les financements publics de la recherche</title>
  <desc id="desc">Sur fond bleu nuit, une constellation relie les sources, les projets et les organisations.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10172d"/><stop offset="1" stop-color="#25234b"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#818cf8" stop-opacity=".26"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <circle cx="1000" cy="160" r="270" fill="url(#glow)"/>
  <g fill="#a5b4fc" opacity=".4"><circle cx="780" cy="62" r="2"/><circle cx="1180" cy="76" r="2"/><circle cx="840" cy="290" r="2"/><circle cx="1100" cy="310" r="2"/><circle cx="1210" cy="240" r="2"/></g>
  <text x="64" y="65" fill="#bfc7ff" font-family="Arial, sans-serif" font-size="13" letter-spacing="3">PUBLIC R&amp;D FUNDING INTELLIGENCE</text>
  <text x="60" y="165" fill="#ffffff" font-family="Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="-3">Orion</text>
  <text x="64" y="220" fill="#f0f1ff" font-family="Arial, sans-serif" font-size="26">Explorer les financements publics</text>
  <text x="64" y="257" fill="#f0f1ff" font-family="Arial, sans-serif" font-size="26">de la recherche.</text>
  <text x="64" y="312" fill="#b2bbd6" font-family="Arial, sans-serif" font-size="15">Des sources officielles aux projets, aux organisations et aux territoires.</text>
  <path d="M850 263 945 160 1035 182 1130 70" fill="none" stroke="#a5b4fc" stroke-opacity=".55" stroke-width="2"/>
  <g fill="#c7d2fe"><circle cx="850" cy="263" r="8"/><circle cx="945" cy="160" r="8"/><circle cx="1035" cy="182" r="8"/></g>
  <circle cx="1130" cy="70" r="10" fill="#ffffff"/>
</svg>
