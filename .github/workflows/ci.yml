name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Déclenchement manuel gardé nu : il sert à valider la chaîne après
  # une période de quota épuisé. Le job `deploy` a été RETIRÉ le
  # 2026-08-29 (hygiène G4, arbitrage Charlotte) : il court-circuitait
  # la porte snapshot D7 bis et tirait de GHCR contre la décision D1.
  # Le déploiement est manuel, par ./infra/deploy.sh, derrière la porte.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    # Garde-fou absolu (incident du 2026-08-19 : un job e2e bloqué a
    # tourné 360 min, deux fois — 1 995 min de quota brûlées).
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: orion
          POSTGRES_PASSWORD: orion
          POSTGRES_DB: orion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orion"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # L'étape Post (élagage du cache) casse sur le runner depuis
          # uv 0.12.5 alors que les tests sont verts — on coupe
          # l'élagage, le cache reste (2026-08-17).
          prune-cache: false
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      # Tests create and migrate their own database (see tests/conftest.py).
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: orion
          POSTGRES_PASSWORD: orion
          POSTGRES_DB: orion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orion"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ORION_DATABASE_URL: postgresql+psycopg://orion:orion@localhost:5432/orion
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # L'étape Post (élagage du cache) casse sur le runner depuis
          # uv 0.12.5 alors que les tests sont verts — on coupe
          # l'élagage, le cache reste (2026-08-17).
          prune-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run python scripts/seed_e2e.py
        working-directory: backend
      - run: uv run uvicorn orion.main:app --port 8000 &
        working-directory: backend
        env:
          # Pivot accès privé (2026-08-22) : la suite navigue connectée —
          # l'API de recette ouvre la porte aux adresses e2e, en mode dev
          # (aucun email ne part, le lien revient dans la réponse).
          ORION_AUTH_DEV: "1"
          ORION_PUBLIC_ORIGIN: http://localhost:4173
          ORION_LOGIN_ALLOWLIST: e2e-a@lensorion.test,e2e-b@lensorion.test,e2e-c@lensorion.test,e2e-d@lensorion.test,e2e-e@lensorion.test,e2e-f@lensorion.test,e2e-g@lensorion.test,e2e-h@lensorion.test
          ORION_LOGIN_LIMIT_PER_IP_HOUR: "1000"
          ORION_LOGIN_LIMIT_PER_PAIR_HOUR: "200"
          ORION_LOGIN_LIMIT_PER_EMAIL_HOUR: "400"
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      # Le blocage du 2026-08-19 : `--with-deps` lance un apt-get qui
      # peut attendre un verrou dpkg sans fin. Les bibliothèques
      # système des navigateurs sont déjà présentes sur ubuntu-latest :
      # on installe les navigateurs SEULS, en cache, avec son propre
      # timeout court — l'échec est alors franc, jamais une attente.
      - id: playwright-version
        run: echo "v=$(pnpm exec playwright --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
        working-directory: frontend
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.v }}
      - run: pnpm exec playwright install chromium firefox
        working-directory: frontend
        timeout-minutes: 6
      - run: pnpm exec vite preview --port 4173 &
        working-directory: frontend
      - name: Run the Playwright journeys
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:4173
        run: |
          curl -sf --retry 30 --retry-delay 1 --retry-connrefused http://localhost:8000/api/health
          curl -sf --retry 30 --retry-delay 1 --retry-connrefused http://localhost:4173 -o /dev/null
          pnpm e2e

      # The latency guard (chantier performance). The seeded corpus is
      # tiny, so this cannot catch volume walls — it catches what actually
      # bit us: algorithmic regressions. A plan that flips, a re-scan
      # reintroduced, a facet that loses its index path all blow through
      # a 150 ms budget on a corpus this small.
      - name: Latency budgets
        working-directory: backend
        run: uv run python scripts/bench_api.py --passes 3 --seed 1 --budgets --seeded

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend, e2e]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: rev
        run: echo "short=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/orion-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Le même tampon qu'en local : scripts/source-rev.sh rend les
          # 12 premiers caractères du SHA d'un arbre propre. Longueur
          # FIXE des deux côtés — l'abréviation automatique de git
          # dépend du nombre d'objets, que le clone superficiel de la CI
          # n'a pas. Une image tirée du registre se compare donc au
          # dépôt exactement comme une image construite en local.
          build-args: |
            GIT_REV=${{ steps.rev.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
