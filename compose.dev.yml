name: orion-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    # Docker caps /dev/shm at 64 MB; parallel workers sharing the
    # larger work_mem above overflow it and the query dies with
    # "No space left on device" (real-run finding, 2026-08-03).
    shm_size: 128m
    # This database exists for the TEST SUITE, whose corpus is a handful
    # of seeded rows. It used to carry a full copy of the corpus beside
    # the production stack — two PostgreSQL instances and two 6 GB
    # databases on one 8 GB laptop. It no longer does: `make test` runs
    # against `orion_test`, and the recette runs on the prod stack.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion
      POSTGRES_DB: orion
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata_dev:
