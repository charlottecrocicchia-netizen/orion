name: orion

services:
  postgres:
    image: pgvector/pgvector:pg16
    # Docker caps /dev/shm at 64 MB; parallel workers sharing the
    # larger work_mem above overflow it and the query dies with
    # "No space left on device" (real-run finding, 2026-08-03).
    shm_size: 1gb
    # The corpus outgrew the PostgreSQL defaults with NIH (4 GB of data,
    # 128 MB of cache): searches matching many rows fell to seconds
    # (real-run finding, 2026-08-03). These four settings are the whole
    # fix — no query rewrite needed.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=256MB
    restart: unless-stopped
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: orion
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${API_IMAGE:-ghcr.io/charlottecrocicchia-netizen/orion-api:latest}
    build: ../backend
    restart: unless-stopped
    environment:
      ORION_ENV: ${ORION_ENV:-production}
      ORION_DATABASE_URL: postgresql+psycopg://orion:${POSTGRES_PASSWORD}@postgres:5432/orion
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: ${WEB_IMAGE:-ghcr.io/charlottecrocicchia-netizen/orion-web:latest}
    build: ../frontend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  scheduler:
    image: ${API_IMAGE:-ghcr.io/charlottecrocicchia-netizen/orion-api:latest}
    build: ../backend
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "orion-scheduler"]
    environment:
      ORION_ENV: ${ORION_ENV:-production}
      ORION_DATABASE_URL: postgresql+psycopg://orion:${POSTGRES_PASSWORD}@postgres:5432/orion
      ORION_INGEST_CRON: ${ORION_INGEST_CRON:-0 3 * * 1}
      ORION_INGEST_ON_START: ${ORION_INGEST_ON_START:-false}
    volumes:
      - ingest_data:/app/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  ingest_data:
