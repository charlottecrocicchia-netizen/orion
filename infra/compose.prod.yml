name: orion

services:
  postgres:
    image: pgvector/pgvector:pg16
    # Docker caps /dev/shm at 64 MB; parallel workers sharing the
    # larger work_mem above overflow it and the query dies with
    # "No space left on device" (real-run finding, 2026-08-03).
    # Docker caps /dev/shm at 64 MB; parallel workers sharing a large
    # work_mem overflow it and the query dies with "No space left on
    # device" (real-run finding, 2026-08-03). 256 MB is ample now that
    # work_mem is small — and a 1 GB tmpfs would itself eat VM memory.
    shm_size: 256m
    # SIZED FOR THE MACHINE THAT RUNS IT, not for the corpus.
    #
    # These values assume a 4 GB Docker VM (see docs/hebergement.md).
    # The previous ones (4 GB of shared_buffers) were sized for a corpus
    # on a machine that did not have the memory: on an 8 GB MacBook the
    # VM was itself paged out by macOS — 11 GB of swap in use — so the
    # "cache" lived on disk twice over. Real memory beats nominal cache.
    #
    # Override on a real host: `ORION_PG_SHARED_BUFFERS=8GB` etc. The
    # sizing table per corpus size is in docs/hebergement.md.
    command:
      - postgres
      - -c
      - shared_buffers=${ORION_PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${ORION_PG_EFFECTIVE_CACHE:-2GB}
      - -c
      - work_mem=${ORION_PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${ORION_PG_MAINTENANCE_MEM:-128MB}
    restart: unless-stopped
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: orion
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${API_IMAGE:-ghcr.io/charlottecrocicchia-netizen/orion-api:latest}
    build:
      context: ../backend
      # Le tampon que le lanceur du Bureau vérifie — `make up` l'exporte
      # depuis scripts/source-rev.sh. Une construction hors Makefile le
      # laisse à « inconnu », ce que le lanceur traite comme périmé :
      # dans le doute, il reconstruit plutôt qu'il ne montre du vieux.
      args:
        GIT_REV: ${GIT_REV:-inconnu}
    restart: unless-stopped
    environment:
      ORION_ENV: ${ORION_ENV:-production}
      ORION_DATABASE_URL: postgresql+psycopg://orion:${POSTGRES_PASSWORD}@postgres:5432/orion
    # The download cache lives here too, not only on the scheduler: with
    # the scheduler behind a profile, `make prod-ingest` runs inside this
    # container, and a source re-downloaded on every run would be a
    # gigabytes-per-week mistake.
    volumes:
      - ingest_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: ${WEB_IMAGE:-ghcr.io/charlottecrocicchia-netizen/orion-web:latest}
    build:
      context: ../frontend
      args:
        GIT_REV: ${GIT_REV:-inconnu}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  scheduler:
    image: ${API_IMAGE:-ghcr.io/charlottecrocicchia-netizen/orion-api:latest}
    build: ../backend
    restart: unless-stopped
    # BEHIND A PROFILE: the weekly full replay is a hosting job, not a
    # laptop job. On an 8 GB machine it would wake up on a Monday at 3am
    # and re-ingest the whole corpus. `make up` leaves it off; the VPS
    # deployment starts it explicitly (infra/deploy.sh).
    profiles: ["scheduler"]
    command: ["uv", "run", "--no-sync", "orion-scheduler"]
    environment:
      ORION_ENV: ${ORION_ENV:-production}
      ORION_DATABASE_URL: postgresql+psycopg://orion:${POSTGRES_PASSWORD}@postgres:5432/orion
      ORION_INGEST_CRON: ${ORION_INGEST_CRON:-0 3 * * 1}
      ORION_INGEST_ON_START: ${ORION_INGEST_ON_START:-false}
    volumes:
      - ingest_data:/app/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  ingest_data:
