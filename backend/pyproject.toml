[project]
name = "orion-backend"
version = "0.4.0"
description = "Orion API — R&D funding intelligence for Europe"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pycountry>=24.6",
    "apscheduler>=3.10",
]

[project.scripts]
orion-ingest = "orion.ingest.cli:main"
orion-scheduler = "orion.scheduler:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    # `starlette.testclient` (1.3+) importe httpx2 s'il le trouve et
    # déprécie bruyamment le repli sur httpx. La dépendance est de TEST
    # seulement : le code de production continue d'appeler httpx (les
    # chargeurs d'ingestion), rien n'y change.
    "httpx2>=2.12",
    "ruff>=0.8",
]

[tool.uv]
# The machine's Anaconda Python breaks editable installs (.pth not honoured);
# always use uv-managed interpreters locally. Docker overrides this to use the
# image's Python via UV_PYTHON_PREFERENCE=only-system.
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orion"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
